  <meta name="viewport" content="width=1280, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover" />
  <script>
    (function () {
      function adjustViewport() {
        var targetWidth = 1280;
        var currentWidth = window.innerWidth || window.screen.width || 1280;
        if (currentWidth < targetWidth) {
          var scale = Math.min(1, currentWidth / targetWidth);
          var meta = document.querySelector('meta[name="viewport"]');
          if (meta) {
            meta.setAttribute(
              'content',
              'width=' + targetWidth + ', initial-scale=' + scale.toFixed(4) + ', maximum-scale=3.0, user-scalable=yes, viewport-fit=cover'
            );
          }
        }
      }
      adjustViewport();
      window.addEventListener('orientationchange', adjustViewport);
      window.addEventListener('resize', adjustViewport);
    })();
  </script>
